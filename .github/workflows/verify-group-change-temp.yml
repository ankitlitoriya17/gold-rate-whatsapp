name: Temporary read-only group change verification
on:
  push:
    paths:
      - '.github/workflows/verify-group-change-temp.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate destinations, authorization and group visibility - NO SEND
        env:
          RECIPIENT_1: ${{ secrets.RECIPIENT_1 }}
          RECIPIENT_2: ${{ secrets.RECIPIENT_2 }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_BASE_URL: ${{ secrets.GREEN_API_BASE_URL }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from urllib.request import urlopen, Request
          from urllib.error import HTTPError, URLError
          from gold_alert import destination_chat, group_chat_id, destination_chats, api_base

          chats={}
          for slot in ('RECIPIENT_1', 'RECIPIENT_2', 'GROUP_CHAT_ID'):
              value=os.environ.get(slot,'').strip()
              if slot=='GROUP_CHAT_ID' and not value:
                  print('GROUP_CHAT_ID: not configured')
                  continue
              try:
                  chat=group_chat_id(value) if slot=='GROUP_CHAT_ID' else destination_chat(value)
                  chats[slot]=chat
                  print(slot+': VALID '+('group' if chat.endswith('@g.us') else 'phone'))
              except (ValueError,TypeError):
                  print(slot+': INVALID format')
          try:
              configured=destination_chats()
              print('DESTINATIONS: '+str(len(configured))+' valid distinct')
          except (ValueError,TypeError,KeyError) as exc:
              print('DESTINATIONS: INVALID ('+type(exc).__name__+')')
          try:
              base=api_base()+'/waInstance'+os.environ['GREEN_API_INSTANCE_ID']+'/'
              token=os.environ['GREEN_API_TOKEN']
              with urlopen(Request(base+'getStateInstance/'+token),timeout=12) as r:
                  provider=json.load(r)
              print('GREEN-API AUTHORIZATION: '+('authorized' if provider.get('stateInstance')=='authorized' else 'not authorized'))
          except (HTTPError,URLError,OSError,ValueError,KeyError):
              print('GREEN-API AUTHORIZATION: unavailable')
          if 'RECIPIENT_1' in chats and chats['RECIPIENT_1'].endswith('@g.us'):
              try:
                  with urlopen(Request(base+'getChats/'+token),timeout=12) as r:
                      result=json.load(r)
                  if isinstance(result,list):
                      found=any(isinstance(x,dict) and x.get('id')==chats['RECIPIENT_1'] for x in result)
                      print('RECIPIENT_1 GROUP IN GETCHATS: '+('listed' if found else 'not listed'))
                  else:
                      print('RECIPIENT_1 GROUP IN GETCHATS: provider response unrecognized')
              except (HTTPError,URLError,OSError,ValueError,KeyError,NameError):
                  print('RECIPIENT_1 GROUP IN GETCHATS: unavailable')
          try:
              with open('.delivery-state.json',encoding='utf-8') as f:
                  ledger=json.load(f)
              for slot,chat in chats.items():
                  marker=hashlib.sha256(chat.encode('utf-8')).hexdigest()[:32]
                  prior=[d for d,rec in ledger.items() if isinstance(rec,dict) and rec.get(marker,{}).get('status')=='queued']
                  print(slot+' PREVIOUS API QUEUE RECEIPT: '+('yes' if prior else 'no prior record'))
          except (OSError,ValueError,TypeError):
              print('PRIOR RECEIPT CHECK: unavailable')
          print('NO SEND: only GET requests to GREEN-API were performed')
          PY
