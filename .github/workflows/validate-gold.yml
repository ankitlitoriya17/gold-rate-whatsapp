name: Verify gold data (no WhatsApp sends)
on:
  push:
    paths:
      - "gold_alert.py"
      - "datia_rates.py"
      - "market_brief.py"
      - "delivery_ledger.py"
      - "tests/**"
      - ".github/workflows/validate-gold.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Preview live prices (never sends WhatsApp)
        env:
          DRY_RUN: "true"
          SEND_ENABLED: "false"
        run: python gold_alert.py
