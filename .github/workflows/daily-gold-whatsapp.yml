name: Datia Gold WhatsApp (External Trigger)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only; do not send
        type: boolean
        required: true
        default: true
      enforce_window:
        description: Legacy input (ignored); external dispatch sends latest dated rates at any time
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: datia-daily-gold-rate
  cancel-in-progress: false
jobs:
  gold-alert:
    runs-on: ubuntu-24.04
    # Up to ~4 min of source retries + a 10 min hold if Aaj Tak is down.
    timeout-minutes: 20
    env:
      GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
      GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
      LEDGER_KEY: ${{ secrets.LEDGER_KEY }}
      GREEN_API_BASE_URL: ${{ secrets.GREEN_API_BASE_URL }}
      GREEN_API_MEDIA_URL: ${{ secrets.GREEN_API_MEDIA_URL }}
      OWNER_RECIPIENT: ${{ secrets.OWNER_RECIPIENT }}
      RECIPIENT_2: ${{ secrets.RECIPIENT_2 }}
      GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      SEND_ENABLED: ${{ vars.SEND_ENABLED }}
      HOLD_MINUTES: '10'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install chart dependency
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build gold report and optionally send
        run: python gold_alert.py
      - name: Upload weekly chart preview (dry run)
        if: always() && hashFiles('weekly_preview.png') != ''
        uses: actions/upload-artifact@v7
        with:
          name: weekly-chart-preview
          path: weekly_preview.png
          retention-days: 7
      - name: Alert owner on failure
        if: failure()
        run: python owner_alert.py "Daily gold workflow FAIL hua (step error). Group ko message gaya ya nahi, Actions log check karein."
