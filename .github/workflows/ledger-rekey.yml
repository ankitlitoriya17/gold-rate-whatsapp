name: One-time ledger re-key (HMAC)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: datia-daily-gold-rate
  cancel-in-progress: false
jobs:
  rekey:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Re-key .delivery-state.json
        env:
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          LEDGER_KEY: ${{ secrets.LEDGER_KEY }}
          RECIPIENT_1: ${{ secrets.RECIPIENT_1 }}
          RECIPIENT_2: ${{ secrets.RECIPIENT_2 }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python delivery_ledger.py --rekey
