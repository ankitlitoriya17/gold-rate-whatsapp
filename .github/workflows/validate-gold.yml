name: Verify gold data (no WhatsApp sends)
on:
  push:
    paths:
      - "gold_alert.py"
      - "delivery_ledger.py"
      - "tests/**"
      - ".github/workflows/validate-gold.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inspect live silver feed metadata (no recipients)
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://trackliveprice.com/api/silver.json'
          req=urllib.request.Request(url,headers={'User-Agent':'DatiaGoldAlert/1.0'})
          with urllib.request.urlopen(req,timeout=20) as response:
              data=json.load(response)
          print('top-level keys:', sorted(data.keys()))
          for key in ('metal','purity','unit','source'):
              print(key,repr(data.get(key)))
          rows=data.get('rows',[])
          print('rows count', len(rows))
          print('last row', repr(rows[-1]) if rows else 'empty')
          PY
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Preview live prices (never sends WhatsApp)
        env:
          DRY_RUN: "true"
          SEND_ENABLED: "false"
        run: python gold_alert.py
