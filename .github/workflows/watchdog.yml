name: Daily send watchdog
# Runs after the 22:00 IST trigger window. If today's message has no confirmed
# receipt for every destination (trigger never fired, token expired, send failed),
# alerts the owner (RECIPIENT_1). GitHub schedules can run late; that is fine here.
on:
  schedule:
    - cron: '7 18 * * *'   # 23:37 IST
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check today's delivery receipts
        env:
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_BASE_URL: ${{ secrets.GREEN_API_BASE_URL }}
          RECIPIENT_1: ${{ secrets.RECIPIENT_1 }}
          RECIPIENT_2: ${{ secrets.RECIPIENT_2 }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEND_ENABLED: ${{ vars.SEND_ENABLED }}
        run: python owner_alert.py --watchdog
