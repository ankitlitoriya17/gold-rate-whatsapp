name: Probe Datia HTML card selectors (no WhatsApp)
on:
  push:
    paths: ['.github/workflows/probe-datia-cards.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect small relevant HTML fragments
        run: |
          python - <<'PY'
          import urllib.request, re
          for metal in ('gold','silver'):
              url=f'https://www.aajtak.in/commodity/{metal}-rate-in-datia-today'
              body=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20).read().decode('utf-8','replace')
              print('===== ',metal,'=====')
              for term in ('Last Updated @', '24 Karat','22 Karat','1 kg','gs-price-card','gs-karat-cell__price','gs-karat-cell__label','gs-silver-cell'):
                  ind=body.find(term)
                  print('\nTERM',term,'OFFSET',ind)
                  if ind>=0:
                      print(repr(body[max(0,ind-250):ind+700]))
          PY
