name: Verify gold data (no WhatsApp sends)
on:
  push:
    paths:
      - "**.py"
      - "requirements.txt"
      - "ruff.toml"
      - ".github/workflows/validate-gold.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.16.9
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Preview live prices (never sends WhatsApp)
        env:
          DRY_RUN: "true"
          SEND_ENABLED: "false"
        run: python gold_alert.py
      - name: Upload weekly chart preview
        if: always() && hashFiles('weekly_preview.png') != ''
        uses: actions/upload-artifact@v7
        with:
          name: weekly-chart-preview
          path: weekly_preview.png
          retention-days: 7
