name: Temporary read-only GREEN-API recipient validation (NO SEND)
on:
  push:
    paths:
      - '.github/workflows/diagnose-greenapi-readonly-temp.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate destinations and provider state without sending
        env:
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_BASE_URL: ${{ secrets.GREEN_API_BASE_URL }}
          RECIPIENT_1: ${{ secrets.RECIPIENT_1 }}
          RECIPIENT_2: ${{ secrets.RECIPIENT_2 }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from gold_alert import destination_chats, api_base

          try:
              chats=destination_chats()
              print('Configuration: valid, '+str(len(chats))+' distinct destinations')
          except Exception as exc:
              print('Configuration invalid: '+type(exc).__name__+': '+str(exc))
              chats=[]

          state={}
          try:
              with open('.delivery-state.json', encoding='utf-8') as f:
                  state=json.load(f)
          except (OSError, ValueError):
              print('Previous ledger: unavailable')
          for i,chat in enumerate(chats,1):
              key=hashlib.sha256(chat.encode()).hexdigest()[:32]
              matches=[(day,row[key]['status']) for day,row in state.items() if isinstance(row,dict) and key in row]
              accepted=[day for day,status in matches if status=='queued']
              print('Slot '+str(i)+': '+('group' if chat.endswith('@g.us') else 'phone')+
                    '; earlier GREEN-API acceptance: '+('yes' if accepted else 'not recorded')+
                    '; last acceptance date: '+(max(accepted) if accepted else 'none'))
          instance=os.environ.get('GREEN_API_INSTANCE_ID','')
          token=os.environ.get('GREEN_API_TOKEN','')
          try:
              root=api_base()+'/waInstance'+instance+'/'
              with urlopen(Request(root+'getStateInstance/'+token),timeout=12) as r:
                  st=json.load(r).get('stateInstance')
              print('GREEN-API instance state: '+(st if st in {'authorized','notAuthorized','blocked','sleepMode','starting','suspended'} else 'unknown'))
          except (HTTPError,URLError,ValueError,OSError):
              print('GREEN-API instance state: unable to verify')
          try:
              with urlopen(Request(root+'getChats/'+token),timeout=12) as r:
                  items=json.load(r)
              if isinstance(items,list):
                  visible={x.get('id') for x in items if isinstance(x,dict)}
                  for i,chat in enumerate(chats,1):
                      print('Slot '+str(i)+' listed in current WhatsApp chats: '+('yes' if chat in visible else 'no / not in returned list'))
              else:
                  print('GREEN-API getChats: unexpected response structure')
          except (HTTPError,URLError,ValueError,OSError,NameError):
              print('GREEN-API getChats: unavailable')
          print('NO WhatsApp messages attempted or sent by this diagnostic')
          PY
