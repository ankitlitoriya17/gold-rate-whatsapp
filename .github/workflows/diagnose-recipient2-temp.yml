name: Temporary recipient slot 2 masked diagnostic (NO SEND)
on:
  push:
    paths:
      - ".github/workflows/diagnose-recipient2-temp.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Show only masked suffix of recipient slot 2
        env:
          RECIPIENT_2: ${{ secrets.RECIPIENT_2 }}
        run: |
          python - <<'PY'
          import os, re
          value = os.environ.get('RECIPIENT_2', '').strip()
          if re.fullmatch(r'[+0-9 ()-]{10,22}', value):
              digits = re.sub(r'\D', '', value)
              print('RECIPIENT_2: phone number ending **' + digits[-4:] if len(digits) >= 4 else 'RECIPIENT_2: malformed')
          elif re.fullmatch(r'[0-9-]{10,35}@g\.us', value):
              print('RECIPIENT_2: WhatsApp group ending @g.us (not a phone)')
          elif value:
              print('RECIPIENT_2: configured but unexpected format')
          else:
              print('RECIPIENT_2: missing')
          PY
