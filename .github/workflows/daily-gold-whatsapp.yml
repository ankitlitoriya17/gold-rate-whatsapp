name: Datia Gold WhatsApp (External Trigger)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only; do not send
        type: boolean
        required: true
        default: true
      enforce_window:
        description: Require 11:00–13:45 IST for external scheduled dispatches
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: datia-daily-gold-rate
  cancel-in-progress: false
jobs:
  gold-alert:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build gold report and optionally send
        env:
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_BASE_URL: ${{ secrets.GREEN_API_BASE_URL }}
          RECIPIENT_1: ${{ secrets.RECIPIENT_1 }}
          RECIPIENT_2: ${{ secrets.RECIPIENT_2 }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          ENFORCE_DELIVERY_WINDOW: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce_window || false }}
          SEND_ENABLED: ${{ vars.SEND_ENABLED }}
        run: python gold_alert.py
