name: Daily send watchdog
# Runs after the 22:00 IST trigger window. If today's message has no confirmed
# receipt for every destination (trigger never fired, token expired, send failed),
# alerts the owner (RECIPIENT_2). GitHub schedules can run late; that is fine here.
on:
  # Several tries because GitHub schedules run late; the watchdog checks the right
  # day itself (yesterday if it runs before 22:45 IST) and alerts only once per day.
  schedule:
    - cron: '7 18 * * *'   # 23:37 IST
    - cron: '37 2 * * *'   # 08:07 IST next morning
    - cron: '7 6 * * *'    # 11:37 IST next morning
  workflow_dispatch:
permissions:
  contents: write  # records 'alerted once' in the ledger
jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check today's delivery receipts
        env:
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          LEDGER_KEY: ${{ secrets.LEDGER_KEY }}
          GREEN_API_BASE_URL: ${{ secrets.GREEN_API_BASE_URL }}
          OWNER_RECIPIENT: ${{ secrets.OWNER_RECIPIENT }}
          RECIPIENT_2: ${{ secrets.RECIPIENT_2 }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEND_ENABLED: ${{ vars.SEND_ENABLED }}
        run: python owner_alert.py --watchdog
