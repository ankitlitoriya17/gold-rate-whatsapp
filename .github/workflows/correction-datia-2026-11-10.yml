name: Correct today's stale Datia WhatsApp report (one time)
on:
  push:
    paths:
      - '.datia-correction-2026-11-10.signal'
permissions:
  contents: write
concurrency:
  group: datia-daily-gold-rate
  cancel-in-progress: false
jobs:
  correction:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate tests
        run: python -m unittest discover -s tests -v
      - name: Send one-time corrected Datia local quotation
        env:
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_BASE_URL: ${{ secrets.GREEN_API_BASE_URL }}
          RECIPIENT_1: ${{ secrets.RECIPIENT_1 }}
          RECIPIENT_2: ${{ secrets.RECIPIENT_2 }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEND_ENABLED: ${{ vars.SEND_ENABLED }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, datetime
          from datia_rates import fetch_datia_quote, format_datia_message
          from delivery_ledger import DeliveryLedger
          from gold_alert import TZ, send
          now = datetime.now(TZ)
          if now.date() != date(2026,11,10):
              raise RuntimeError('Expired correction — not 10 November IST')
          if os.environ.get('SEND_ENABLED','').lower() != 'true':
              raise RuntimeError('Sending disabled — correction not sent')
          quote = fetch_datia_quote(now.date())
          message = '⚠️ *Correction: Updated Datia Local Rates*\n' + format_datia_message(quote)
          print('Sending corrected source/date:', quote['published'].isoformat())
          class CorrectionLedger:
              def __init__(self):
                  self.inner=DeliveryLedger(os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_TOKEN'])
              def claim(self, day, chat):
                  return self.inner.claim(day, 'datia-local-correction-20261110:' + chat)
              def update(self, day, chat, status, message_id=None):
                  return self.inner.update(day, 'datia-local-correction-20261110:' + chat, status, message_id)
          send(message, now=now, ledger=CorrectionLedger())
          PY
