name: Probe read-only market quote endpoints
on:
  push:
    paths:
      - '.github/workflows/probe-markets.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Test free quote endpoints without sending messages
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          hosts=['query1.finance.yahoo.com','query2.finance.yahoo.com']
          symbols=['^NSEI','^BSESN','INR=X','BZ=F']
          for host in hosts:
            for symbol in symbols:
              url='https://'+host+'/v8/finance/chart/'+urllib.parse.quote(symbol,safe='')+'?interval=1d&range=5d'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; InvestorBrief/1.0)','Accept':'application/json'})
              try:
                with urllib.request.urlopen(req,timeout=10) as r:
                  p=json.load(r)
                  node=p.get('chart',{}).get('result',[None])[0] or {}
                  m=node.get('meta',{})
                  ts=node.get('timestamp') or []
                  print(host,symbol,'http',r.status,'currency',m.get('currency'),'price',m.get('regularMarketPrice'),'previous',m.get('chartPreviousClose'),'time',m.get('regularMarketTime'),'bars',len(ts))
              except Exception as ex:
                print(host,symbol,'ERROR',str(ex)[:100])
          PY
